# Nginx configuration for CheckIn System
# Location: /etc/nginx/sites-available/checkin

server {
    listen 80;
    server_name checkin.fit.vutbr.cz;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name checkin.fit.vutbr.cz;

    # SSL Certificates (managed by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/checkin.fit.vutbr.cz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/checkin.fit.vutbr.cz/privkey.pem;

    # 1. Frontend - Flutter Web Application
    location /checkin/ {
        # Path to the directory where frontend.tar.gz was extracted
        alias /home/YOUR_USER/deploy/checkin-app/frontend/;
        index index.html;
        
        # Necessary for Flutter Web routing (Single Page Application)
        try_files $uri $uri/ /checkin/index.html;
    }

    # 2. Backend API - ASP.NET Core
    location /checkin/api/ {
        # Remove /checkin/api prefix before sending to Kestrel
        rewrite ^/checkin/api/(.*)$ /api/$1 break;

        proxy_pass http://localhost:5005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. SignalR Hubs (Real-time features)
    location /checkin/api/hubs/ {
        rewrite ^/checkin/api/(.*)$ /$1 break;

        proxy_pass http://localhost:5005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade"; # Important for WebSockets
        proxy_set_header Host $host;
        
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Automatic redirect from /checkin to /checkin/
    location = /checkin {
        return 301 /checkin/;
    }
}